name: CI-CD DevSecOps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks scan (before compilation)
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the Gitleaks report
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      # Nom de l'image (nettoyé : sans espace, sans retour à la ligne, en minuscules)
      - name: Set image name
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          CLEAN_USER=$(printf '%s' "$RAW_USER" | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          echo "DOCKER_IMAGE_NAME=${CLEAN_USER}/democyber:latest" >> "$GITHUB_ENV"

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiler le projet (crée le JAR dans target/)
      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # Build Docker image
      - name: Build Docker image
        run: docker build -t "$DOCKER_IMAGE_NAME" .
              # Trivy scan (tableau : fait échouer le pipeline si CRITICAL/HIGH)
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Trivy scan (JSON : pour le rapport)
      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'

      # Upload du rapport Trivy
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      # Test Docker image
      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 "$DOCKER_IMAGE_NAME"
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      # Show image details (name, tag, size)
      - name: Show image details
        run: docker images "$DOCKER_IMAGE_NAME"